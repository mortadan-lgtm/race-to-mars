<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Moved</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#0E1116;color:#E8EAED;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#7FB8FF}</style></head>
<body><p>This game has moved. Taking you there with your progress&hellip;<br><a id="a" href="https://lockin-games.pages.dev/race-to-mars/">Continue</a></p>
<script>
(function(){
  var P = ["raceToMars.", "waveQuest.", "nutrientQuest.", "lipidsLab.", "dietdet.", "kinematicsClimb.", "skydivePalm.", "harmonicQuest.", "coulombQuest."], to = new URLSearchParams(location.search).get('to') || 'race-to-mars/';
  if (!/^[a-z0-9-]+\/([a-z0-9-]+(\.html)?)?$/.test(to)) to = 'race-to-mars/';
  document.getElementById('a').href = 'https://lockin-games.pages.dev/' + to;
  var o = {};
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i);
    if (P.some(function(p){ return k.indexOf(p) === 0; })) o[k] = localStorage.getItem(k); } } catch(e) {}
  function b64(u){ var s = ''; for (var i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function send(d, z){ location.replace('https://lockin-games.pages.dev/import.html#to=' + encodeURIComponent(to) + (d ? '&z=' + z + '&d=' + d : '')); }
  if (!Object.keys(o).length) return send('', 0);
  var raw = new TextEncoder().encode(JSON.stringify(o));
  if (window.CompressionStream) {
    new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()
      .then(function(b){ send(b64(new Uint8Array(b)), 1); }, function(){ send(b64(raw), 0); });
  } else send(b64(raw), 0);
})();
</script></body></html>
